name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint, types, and offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Mypy (strict)
        run: mypy

      # No services, no API key, no network — if this job needs any of those,
      # something has leaked out of the adapter layer.
      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml -q

      - name: Demo runs end to end
        run: python -m aic.cli demo

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  integration:
    name: Integration tests (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aic
          POSTGRES_PASSWORD: aic
          POSTGRES_DB: aic
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aic -d aic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run migrations
        env:
          AIC_DATABASE_URL: postgresql://aic:aic@localhost:5432/aic
        run: python -m aic.cli migrate

      - name: Integration tests
        env:
          AIC_DATABASE_URL: postgresql://aic:aic@localhost:5432/aic
          AIC_REDIS_URL: redis://localhost:6379/0
        run: pytest -m integration -q

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ai-incident-commander:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image actually boots and indexes its runbook corpus, which a
      # build-only job would not catch.
      - name: Smoke test the image
        run: |
          docker run -d --name aic-ci -p 8000:8000 \
            -e AIC_RUNBOOK_DIRECTORY=/app/docs/runbooks \
            ai-incident-commander:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/ready > /dev/null; then
              echo "ready after ${i}s"
              curl -fsS http://localhost:8000/ready
              docker rm -f aic-ci
              exit 0
            fi
            sleep 1
          done
          echo "::error::container never became ready"
          docker logs aic-ci
          docker rm -f aic-ci
          exit 1
